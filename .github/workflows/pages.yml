name: Deploy to GitHub Pages

# Builds the site (the app plus the search pages, sitemap, robots.txt and
# llms.txt that server/seo writes) and publishes it at
# https://gabethegeek.github.io/tolara-atlas/.
#
# It runs on every push to main, and after each successful daily sync: the
# sync commits with the built-in token, and GitHub doesn't start other
# workflows from those pushes, so a push trigger alone would leave the site
# a day behind.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily jobs sync"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer one replaces any still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # After a sync, build what the sync just committed.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Where the site lives; the build sets its base path, links and
          # sitemap from this.
          SITE_URL: https://gabethegeek.github.io/tolara-atlas
          # Kit's public form ID for the landing page signup. Not a secret:
          # it's visible in any page that embeds the form. Never put a Kit
          # API key here.
          VITE_KIT_FORM_ID: "10236754"
          # Google Analytics measurement ID (public, like the form ID). Only
          # this build sets it, so local runs never send analytics.
          VITE_GA_ID: "G-R3PCYML3YQ"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
