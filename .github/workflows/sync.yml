name: Daily jobs sync

on:
  schedule:
    # 09:00 UTC daily (~5am ET) — ATS boards refresh overnight, so this
    # catches postings that went up the previous business day.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Init database (no-op if it already exists)
        run: npm run db:init

      - name: Run sync
        run: npm run sync

      - name: Geocode newly-synced roles
        run: npm run geocode

      # Fills the company intelligence cache so the export below can bake
      # real dossiers into the per-company files. Time-budgeted: it works
      # through the stalest companies first and leaves the rest for
      # tomorrow, so the daily run stays bounded.
      - name: Pre-warm company dossiers
        run: npm run prewarm -- --minutes=25

      - name: Export map data for the frontend
        run: npm run export

      - name: Commit updated database and map data
        run: |
          git config user.name "tolara-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tolara.db public/data/map-data.json public/data/companies
          git diff --cached --quiet || git commit -m "chore: daily jobs sync"
          git push
