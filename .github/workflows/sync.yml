name: Daily jobs sync

on:
  schedule:
    # 09:00 UTC daily (~5am ET) — ATS boards refresh overnight, so this
    # catches postings that went up the previous business day.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Init database (no-op if it already exists)
        run: npm run db:init

      - name: Run sync
        run: npm run sync

      - name: Commit updated database
        run: |
          git config user.name "tolara-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tolara.db
          git diff --cached --quiet || git commit -m "chore: daily jobs sync"
          git push
